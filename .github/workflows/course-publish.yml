name: Course - Publish assignment forms
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: course-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            assignments
            .github/ISSUE_TEMPLATE
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate, snapshot current main and update forms
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/course_publish.py
