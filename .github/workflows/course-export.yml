name: Course - Export grades
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: course-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            assignments
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate CSV, Excel and JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/course_github.py export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: course-grades-${{ github.run_number }}
          path: course-output/
          retention-days: 30
          if-no-files-found: error
